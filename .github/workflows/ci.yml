name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只跑校验，不做部署。站点由本地 `npm run deploy`（wrangler 直传）发布，
# 因此无需给 CI 任何托管方凭据。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # typecheck + test + build，与本地交付判据完全一致。
      - run: npm run verify
